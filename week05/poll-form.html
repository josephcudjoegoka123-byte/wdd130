<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML - User Poll</title>
    <meta name="description">
    <meta name="author" content="Joseph Cudjoe Goka">
    <link rel="stylesheet" href="#">
</head>
<body>
    <header>

    </header>
    <main>
        <form>
            <label for="user's fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="user's email address">Email:</label>
            <input type="text" id="emailmail" name="emailmail" required>

        </form>
        <form>
            <label for="quantity"> Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="Safari">Safari</option>
                <option value="Edge">Edge</option>
                <option value="Chrome">Chrome</option>
                <option value="other">Other</option>
            </select>
            <label for="pet">Do you have household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="feedback">List the places you have lived</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="stillwater florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>   
            <button type="submit">Submit Poll</button>   
        </form>

    </main>
    <footer>

    </footer>
</body>
</html>
