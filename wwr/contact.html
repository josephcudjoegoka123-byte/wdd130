    <main>
        <h1>Contact Goka Water Rafting</h1>
        <div class="contact-info">
            <p>123 Main River Street, New York, NY 10001</p>
            <p>Phone: (123) 456-7890</p>
            <p>Email: info@gokawaterrafting.com</p>
        </div>
        <div class="contact-container">
            <div class="map">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114464.52390335455!2d50.088279!3d26.2172!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e49e7d5a2c0b0b1%3A0x1!2sAl%20Khobar%2C%20Saudi%20Arabia!5e0!3m2!1sen!2sus!4v1710000000000!5m2!1sen!2sus" 
                    width="600" 
                    height="450" 
                    allowfullscreen
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Company location map">
                </iframe>
            </div>
            <form class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <fieldset>
                    <legend>Message Purpose</legend>
                    <div>
                        <input type="radio" id="purpose-general" name="purpose" value="general" required>
                        <label for="purpose-general">General Inquiry</label>
                    </div>
                    <div>
                        <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                        <label for="purpose-reservation">Reservation Question</label>
                    </div>
                    <div>
                        <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                        <label for="purpose-suggestion">Website Suggestion</label>
                    </div>             
                </fieldset>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Type here..." required></textarea>
                
                <div>
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>
                
                <button type="submit">Get in Touch</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Happy employee - Tour Guide" width="150">
                    <figcaption>Tour Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Happy employee - Reservation Manager" width="150">
                    <figcaption>Reservation Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Happy employee - Safety Instructor" width="150">
                    <figcaption>Safety Instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>
