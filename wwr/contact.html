    <main>
        <div class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street, New York, NY 10001</p>
            <p>Phone: (123) 456-7890</p>
            <p>Email: info@gokawaterrafting.com</p>
        </div>
        <div class="contact-container">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387190.2799141685!2d-74.2598756871875!3d40.69767006390544!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c250b7e6e8a9b7%3A0x8c8c8c8c8c8c8c8c!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2suk!4v1633036800000" 
                    width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
        </div>
        <form class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <fieldset>
                <legend>Message Purpose</legend>

                <label><input type="radio" id="purpose" name="purpose" value="general"> General Inquiry</label>
                
                <label><input type="radio" id="reason" name="reason" value="Reservation"> Reservation</label>

                <label ><input type="radio" id="website" name="website" value="website"> Website Suggestion</label>
                
            </fieldset>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Type here..."></textarea>
            
            <label><input type="checkbox" id="subscribe" name="subscribe"> Please subscribe me to the monthly newsletter</label>

            <button type="submit">Get in Touch</button>
        </form>
        
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/rafting17_600.jpg" alt="Employee" width="150">
                    <figcaption> Employee Profile </figcaption>
                </figure>
                <figure>
                    <img src="images/rafting19_600.jpg" alt=" Employee" width="150">

                <figure>

        </section>
