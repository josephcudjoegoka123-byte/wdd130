    <main>
        <div class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street, New York, NY 10001</p>
            <p>Phone: (123) 456-7890</p>
            <p>Email: info@gokawaterrafting.com</p>
        </div>
        <div class="contact-container">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114464.52390335455!2d50.088279!3d26.2172!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e49e7d5a2c0b0b1%3A0x1!2sAl%20Khobar%2C%20Saudi%20Arabia!5e0!3m2!1sen!2sus!4v1710000000000!5m2!1sen!2sus" 
                        width="600" 
                        height="450" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
  </iframe>
        </div>
        <form class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <fieldset>
                <legend>Message Purpose</legend>

                <label for="purpose">General Inquiry</label>
                <input type="radio" id="purpose" name="purpose">

                <label for="reason">Reservation</label>
                <input type="radio" id="reason" name="purpose">

                <label for="website">Website Suggestion</label>
                <input type="radio" id="website" name="purpose">
                
            </fieldset>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Type here..."></textarea>
            
            <label for="subscribe"> Please subscribe me to the monthly newsletter</label>
            <input type="checkbox" id="subscribe" name="subscribe">

            <button type="submit">Get in Touch</button>
        </form>
        
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/employee1.jpg" alt="Employee" width="150">
                    <figcaption> Employee Profile </figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt=" Employee" width="150">

                </figure>
                <figure>

                    <figcaption> Employee Profile </figcaption>
                </figure>
            </div>
        </section>
