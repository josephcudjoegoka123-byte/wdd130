<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Goka Water Rafting</title>
    <meta name="description"
      content="Goka Water Rafting Home Page">
    <meta name="author" content="Joseph Cudjoe Goka">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/z-raftingbw.png" alt="Rafting Site Logo">
        <nav>
            <ul>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/rafting17_600.jpg" alt="People rafting in river">
            <h1>Have An Adventure!</h1>
        </div>
        <section class="cta">
            <h2>Ready for an unforgettable adventure?</h2>
            <p>Check out our amazing trips and book your rafting experience today!</p>
            <a href="trips.html" class="cta-btn">Book a Trip Now</a>
        </section>
        <section class="newsletter">
            <h2>Sign Up for Our Newsletter</h2>
        <form class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <fieldset>
                <legend>Message Purpose</legend>
                <label for="purpose">General Inquiry</label>
                <input type="radio" id="purpose" name="purpose">
                <label for="reason">Reservation</label>
                <input type="radio" id="reason" name="purpose">
                <label for="website">Website Suggestion</label>
                <input type="radio" id="website" name="purpose">                
            </fieldset>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Type here..."></textarea>
            <label for="subscribe">Please subscribe me to the monthly newsletter</label>
            <input type="checkbox" id="subscribe" name="subscribe">
            <button type="submit">Get in Touch</button>
        </form>
        </section>
        <section class="home-grid">
            <div>
                <figure>
                    <img src="images/rafting19_600.jpg" alt="Rivers" width="250">
                    <figcaption>Rivers</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting59_600.jpg" alt="Camping" width="250">
                    <figcaption>Camping</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting58_600.jpg" alt="Rapids" width="250">
                    <figcaption>Rapids</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Goka Water Rafting | Joseph Cudjoe Goka</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/share/18fmudfEH4/?mibextid=wwXIfr">
                <img src="images/facebook-bw.svg" alt="facebook profile" width="50">
            </a>
            <a
              href="https://www.linkedin.com/in/joseph-cudjoe-goka-a64599410?utm_source=share_via&utm_content=profile&utm_medium=member_ios">
                <img src="images/linkedin.svg" alt="linkedin profile" width="50">
            </a>
            <a
              href="https://www.instagram.com/sirrr_heisenberg_?stkn=cWIxemRwNWo3YW1n&utm_source=qr">
                <img src="images/instagram-square.svg" alt="instagram profile" width="50">
            </a>
        </nav>
    </footer>
</body>
</html>
